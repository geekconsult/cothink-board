<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How CoThink Board works</title>
  <desc id="desc">A person works through the macOS app and an agent works through an MCP client and local server. Both use the same board store. Board metadata links to project files on disk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6e7681" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9c6b58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#302c30">
    <text x="54" y="63" font-size="16" font-weight="700" letter-spacing="2.5" fill="#ac6b4f">COTHINK BOARD</text>
    <text x="54" y="104" font-size="32" font-weight="700">A shared space for people and agents</text>
    <text x="54" y="137" font-size="16" fill="#766e70">One local board library, two ways to work with it.</text>
    <g filter="url(#shadow)">
      <rect x="54" y="188" width="250" height="138" rx="20" fill="#fff"/>
      <rect x="54" y="356" width="250" height="138" rx="20" fill="#fff"/>
      <rect x="377" y="188" width="260" height="138" rx="20" fill="#fff3df"/>
      <rect x="377" y="356" width="260" height="138" rx="20" fill="#e9f2fb"/>
      <rect x="715" y="225" width="265" height="232" rx="22" fill="#fff"/>
      <rect x="1010" y="268" width="150" height="145" rx="20" fill="#e5f1e9"/>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="1.8">
      <text x="78" y="222" fill="#ab6a50">YOU</text><text x="78" y="390" fill="#678fb5">AGENT</text>
      <text x="401" y="222" fill="#ab6a50">MACOS APP</text><text x="401" y="390" fill="#678fb5">LOCAL MCP SERVER</text>
      <text x="739" y="259" fill="#a77b50">SHARED STORE</text><text x="1030" y="303" fill="#679479">PROJECT FILES</text>
    </g>
    <g font-size="21" font-weight="700">
      <text x="78" y="256">Make connections</text><text x="78" y="424">Explore and edit</text>
      <text x="401" y="256">Visual canvas</text><text x="401" y="424">MCP tools</text>
      <text x="739" y="294">Boards + lists</text><text x="1030" y="337" font-size="18">On disk</text>
    </g>
    <g font-size="14" fill="#736e70">
      <text x="78" y="282">Notes, groups, labels</text><text x="78" y="303">and attachments</text>
      <text x="78" y="450">Uses an MCP client</text><text x="78" y="471">to understand context</text>
      <text x="401" y="282">Edit, arrange, group</text><text x="401" y="303">and save automatically</text>
      <text x="401" y="450">Read context and files</text><text x="401" y="471">or make board edits</text>
      <text x="739" y="323">Notes · groups · links</text><text x="739" y="346">Lists · metadata · history</text>
      <text x="739" y="385">Revision checks protect</text><text x="739" y="406">against stale edits.</text>
      <text x="1030" y="363">Images, PDFs</text><text x="1030" y="385">and other files</text>
    </g>
    <g stroke="#9c6b58" stroke-width="2.3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M317 257 H365"/><path d="M317 425 H365"/><path d="M650 257 H701"/><path d="M650 425 H701"/>
    </g>
    <path d="M981 341 H1000" stroke="#7ca38a" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
    <text x="54" y="562" font-size="14" fill="#80777a">The board JSON stores file references. Keep project files alongside an export when moving it.</text>
  </g>
</svg>
